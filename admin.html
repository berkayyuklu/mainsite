<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Girişi</title>
<!-- Arama motorlarına ve dizinlemeye kapalı -->
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">

  <div class="admin-topbar">
    <span class="logo">BY<span class="accent">.</span>DESIGN</span>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir">
      <svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>

  <!-- ============ GİRİŞ / KAYIT KARTI ============ -->
  <div id="authView" class="admin-card">
    <p class="eyebrow">Yetkili Erişim</p>
    <h1 class="admin-title">Admin Paneli</h1>
    <p class="admin-sub">Bu sayfa sitede listelenmez. Devam etmek için giriş yapın.</p>

    <div class="tab-switch">
      <button class="tab-btn is-active" data-tab="login" type="button">Giriş Yap</button>
      <button class="tab-btn" data-tab="register" type="button">Kayıt Ol</button>
    </div>

    <!-- Giriş formu -->
    <form id="loginForm" class="admin-form">
      <label class="field-label" for="loginEmail">E-posta</label>
      <input class="field-input" type="email" id="loginEmail" required autocomplete="email" placeholder="ornek@eposta.com">

      <label class="field-label" for="loginPassword">Şifre</label>
      <input class="field-input" type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">

      <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
    </form>

    <!-- Kayıt formu -->
    <form id="registerForm" class="admin-form" hidden>
      <label class="field-label" for="registerEmail">E-posta</label>
      <input class="field-input" type="email" id="registerEmail" required autocomplete="email" placeholder="ornek@eposta.com">

      <label class="field-label" for="registerPassword">Şifre</label>
      <input class="field-input" type="password" id="registerPassword" required autocomplete="new-password" minlength="6" placeholder="En az 6 karakter">

      <button type="submit" class="btn btn-primary btn-block">Admin Kaydı Oluştur</button>
    </form>

    <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>
  </div>

  <!-- ============ GİRİŞ YAPILDIKTAN SONRA ============ -->
  <div id="dashboardView" class="admin-card" hidden>
    <p class="eyebrow">Oturum Açık</p>
    <h1 class="admin-title">Hoş geldin</h1>
    <p class="admin-sub" id="dashboardEmail"></p>

    <div class="dashboard-placeholder">
      <p>Admin paneli buradan büyütülebilir: proje ekleme / düzenleme,<br>
      blog yazısı yayınlama gibi işlemler bu alana bağlanabilir.</p>
    </div>

    <button id="logoutBtn" type="button" class="btn btn-outline btn-block">Çıkış Yap</button>
  </div>

  <a class="back-link" href="index.html">← Siteye dön</a>
</div>

<script type="module" src="js/admin.js"></script>
<script src="js/main.js" defer></script>
</body>
</html>
